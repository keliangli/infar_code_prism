name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pure-logic tests
        run: npm test

      # 这里刻意不使用 actions/configure-pages：
      # 它需要先通过 Pages API 读取（未启用时会报 “Get Pages site failed: Not Found”），
      # 而 GITHUB_TOKEN 也无权自动创建 Pages 站点。子路径直接写死，
      # 使构建与上传阶段不依赖 Pages 是否已启用；只有 deploy 阶段需要 Pages 已开启。
      # 前端用 import.meta.env.BASE_URL 读取 graph.json，与此处 base 保持一致。
      - name: Build static site
        run: npm run build -- --base=/infar_code_prism/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
